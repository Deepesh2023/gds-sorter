<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GDS Sorter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .facility-menu {
      max-height: 20rem;
      overflow-y: auto;
    }
  </style>
</head>
<body class="bg-light">
  <main class="container py-5">
    <h1 class="mb-1">GDS Sorter</h1>
    <p class="text-muted mb-4">Pick two facilities to check whether they share an airport.</p>

    <div class="row g-3">
      <div class="col-md-6">
        <label for="facilityA" class="form-label">Facility A</label>
        <div class="dropdown">
          <input type="text" class="form-control" id="facilityA" placeholder="Type a facility…"
                 autocomplete="off" role="combobox" aria-autocomplete="list"
                 aria-expanded="false" aria-controls="menuA" aria-haspopup="listbox">
          <ul class="dropdown-menu w-100 facility-menu" id="menuA" role="listbox" aria-label="Facilities for A"></ul>
        </div>
        <div id="infoA" class="form-text"></div>
      </div>

      <div class="col-md-6">
        <label for="facilityB" class="form-label">Facility B</label>
        <div class="dropdown">
          <input type="text" class="form-control" id="facilityB" placeholder="Type a facility…"
                 autocomplete="off" role="combobox" aria-autocomplete="list"
                 aria-expanded="false" aria-controls="menuB" aria-haspopup="listbox">
          <ul class="dropdown-menu w-100 facility-menu" id="menuB" role="listbox" aria-label="Facilities for B"></ul>
        </div>
        <div id="infoB" class="form-text"></div>
      </div>
    </div>

    <div id="result" class="alert alert-secondary mt-4" role="status" aria-live="polite">
      Select two facilities to compare their airports.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const DATA = {
      groups: [
        { name: "DELHI APTMO", airport: "Indira Gandhi International Airport", iata: "DEL", entries: ["1 CBPO", "Agra NSH", "Ajmer NSH", "Ambala NSH", "Amritsar NSH", "Bareilly NSH", "Bhopal NSH", "Chandigarh NSH", "Dehradun NSH", "Ghaziabad NSH", "Gorakhpur NSH", "Gurgaon NSH", "Gwalior NSH", "Jaipur NSH", "Jalandhar NSH", "Jammu NSH", "Jodhpur NSH", "Kanpur NSH", "Karnal NSH", "Lucknow NSH", "Ludhiana NSH", "Moradabad NSH", "New Delhi NSH", "Srinagar NSH", "Pathankot NSH", "Prayagraj NSH", "Rohtak NSH", "Shimla NSH", "Varanasi NSH", "Rudrapur NSH"] },
        { name: "APTMO MUMBAI", airport: "Chhatrapati Shivaji Maharaj International Airport", iata: "BOM", entries: ["Aurangabad NSH", "Barauni NSH", "Berhampur NSH", "Bhubaneswar NSH", "Dhanbad NSH", "Gaya NSH", "Indore NSH", "Jabalpur NSH", "Jamshedpur NSH", "Mumbai NSH", "Muzaffarpur NSH", "Nagpur NSH", "Panaji NSH", "Patna NSH", "Pune NSH", "Raipur NSH", "Ranchi NSH", "Rourkela NSH", "Sambalpur NSH", "Thane NSH", "Nashik Road NSH"] },
        { name: "GUWAHATI TMO", airport: "Lokpriya Gopinath Bordoloi International Airport", iata: "GAU", entries: ["Agartala NSH", "Aizawl NSH", "Dibrugarh NSH", "Dimapur NSH", "Guwahati NSH", "Imphal NSH", "Itanagar NSH", "Shillong NSH"] },
        { name: "SHAMSHABAD TMO", airport: "Rajiv Gandhi International Airport", iata: "HYD", entries: ["Kurnool NSH", "Tirupati NSH", "Vijayawada NSH", "Visakhapatnam NSH", "Warangal NSH", "Hyderabad NSH"] },
        { name: "KOLKATA APTMO", airport: "Netaji Subhas Chandra Bose International Airport", iata: "CCU", entries: ["Burdwan NSH", "Kharagpur NSH", "Kolkata NSH", "Siliguri NSH", "2 CBPO"] },
        { name: "BENGALURU NSH", airport: "Kempegowda International Airport", iata: "BLR", entries: ["Arsikere NSH", "Belagavi NSH", "Hubballi Dharwad NSH", "Kalaburagi NSH", "Mysuru NSH", "Port Blair NSH", "Bengaluru NSH"] },
        { name: "AHMEDABAD TMO", airport: "Sardar Vallabhbhai Patel International Airport", iata: "AMD", entries: ["Ahmedabad NSH", "Rajkot NSH", "Surat NSH", "Vadodara NSH"] }
      ]
    };

    const facilities = DATA.groups.flatMap((g) =>
      g.entries.map((name) => ({ name, group: g.name, iata: g.iata, airport: g.airport }))
    );

    const infoA = document.getElementById("infoA");
    const infoB = document.getElementById("infoB");
    const result = document.getElementById("result");
    const selected = { A: null, B: null };

    function showInfo(el, facility) {
      el.textContent = facility ? `${facility.group} · ${facility.iata}` : "";
    }

    function haptic(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function setResult(kind, message) {
      result.className = `alert alert-${kind} mt-4`;
      result.textContent = message;
    }

    function updateResult() {
      const a = selected.A;
      const b = selected.B;

      showInfo(infoA, a);
      showInfo(infoB, b);

      if (!a || !b) {
        setResult("secondary", "Select two facilities to compare their airports.");
        return;
      }

      if (a.iata === b.iata) {
        setResult("success", `Match — both are handled via ${a.group} (${a.iata}).`);
        haptic(35);
      } else {
        setResult(
          "danger",
          `No match — ${a.name} goes via ${a.iata} (${a.group}), while ${b.name} goes via ${b.iata} (${b.group}).`
        );
        haptic([35, 60, 35]);
      }
    }

    function createCombobox(input, menu, key) {
      const otherKey = key === "A" ? "B" : "A";
      let items = [];
      let activeIndex = -1;

      function matches(f, q) {
        return (
          f.name.toLowerCase().includes(q) ||
          f.group.toLowerCase().includes(q) ||
          f.iata.toLowerCase().includes(q)
        );
      }

      function render(query) {
        const q = query.trim().toLowerCase();
        const other = selected[otherKey];

        items = facilities.filter(
          (f) => (!other || f.name !== other.name) && (!q || matches(f, q))
        );
        menu.replaceChildren();
        activeIndex = -1;

        if (!items.length) {
          const empty = document.createElement("li");
          empty.className = "dropdown-item-text text-muted";
          empty.textContent = "No facilities found";
          menu.appendChild(empty);
          return;
        }

        items.forEach((f, i) => {
          const li = document.createElement("li");
          li.id = `${input.id}-opt-${i}`;
          li.className = "dropdown-item d-flex justify-content-between align-items-center gap-3";
          li.setAttribute("role", "option");
          li.dataset.index = String(i);

          const name = document.createElement("span");
          name.textContent = f.name;

          const hint = document.createElement("small");
          hint.className = "text-muted text-nowrap";
          hint.textContent = `${f.iata} · ${f.group}`;

          li.append(name, hint);
          li.addEventListener("mousedown", (event) => {
            event.preventDefault();
            choose(i);
          });
          menu.appendChild(li);
        });
      }

      function isOpen() {
        return menu.classList.contains("show");
      }

      function open() {
        menu.classList.add("show");
        input.setAttribute("aria-expanded", "true");
      }

      function close() {
        menu.classList.remove("show");
        input.removeAttribute("aria-activedescendant");
        input.setAttribute("aria-expanded", "false");
        activeIndex = -1;
      }

      function paintActive() {
        for (const li of menu.querySelectorAll('[role="option"]')) {
          const on = Number(li.dataset.index) === activeIndex;
          li.classList.toggle("active", on);
          li.setAttribute("aria-selected", on ? "true" : "false");
          if (on) {
            input.setAttribute("aria-activedescendant", li.id);
            li.scrollIntoView({ block: "nearest" });
          }
        }
        if (activeIndex === -1) input.removeAttribute("aria-activedescendant");
      }

      function choose(index) {
        const f = items[index];
        if (!f) return;
        selected[key] = f;
        input.value = f.name;
        close();
        updateResult();
      }

      function commit() {
        const typed = input.value.trim();
        const current = selected[key];

        if (!typed) {
          selected[key] = null;
        } else {
          const match = facilities.find(
            (f) => f.name.toLowerCase() === typed.toLowerCase()
          );
          const takenByOther = selected[otherKey] && selected[otherKey].name === match?.name;

          if (match && !takenByOther) {
            selected[key] = match;
            input.value = match.name;
          } else if (current) {
            input.value = current.name;
          } else {
            input.value = "";
          }
        }
        updateResult();
      }

      input.addEventListener("focus", () => {
        render("");
        open();
      });

      input.addEventListener("click", () => {
        if (!isOpen()) open();
      });

      input.addEventListener("input", () => {
        render(input.value);
        open();
      });

      input.addEventListener("blur", () => {
        // Give an option's mousedown -> choose() a chance to run first.
        setTimeout(() => {
          close();
          commit();
        }, 0);
      });

      input.addEventListener("keydown", (event) => {
        switch (event.key) {
          case "ArrowDown":
          case "ArrowUp": {
            event.preventDefault();
            if (!isOpen()) {
              render(input.value);
              open();
            }
            if (!items.length) return;
            const delta = event.key === "ArrowDown" ? 1 : -1;
            activeIndex =
              activeIndex === -1
                ? (delta === 1 ? 0 : items.length - 1)
                : (activeIndex + delta + items.length) % items.length;
            paintActive();
            break;
          }
          case "Enter": {
            if (isOpen()) {
              event.preventDefault();
              if (activeIndex >= 0) choose(activeIndex);
            }
            break;
          }
          case "Escape": {
            if (isOpen()) {
              event.preventDefault();
              close();
            }
            break;
          }
          case "Tab": {
            close();
            commit();
            break;
          }
        }
      });
    }

    createCombobox(document.getElementById("facilityA"), document.getElementById("menuA"), "A");
    createCombobox(document.getElementById("facilityB"), document.getElementById("menuB"), "B");
  </script>
</body>
</html>
