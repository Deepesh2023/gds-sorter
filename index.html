<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GDS Sorter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <h1 class="mb-1">GDS Sorter</h1>
    <p class="text-muted mb-4">Pick two facilities to check whether they share an airport.</p>

    <div class="row g-3">
      <div class="col-md-6">
        <label for="facilityA" class="form-label">Facility A</label>
        <select id="facilityA" class="form-select">
          <option value="" selected disabled>Choose a facility</option>
        </select>
        <div id="infoA" class="form-text"></div>
      </div>

      <div class="col-md-6">
        <label for="facilityB" class="form-label">Facility B</label>
        <select id="facilityB" class="form-select">
          <option value="" selected disabled>Choose a facility</option>
        </select>
        <div id="infoB" class="form-text"></div>
      </div>
    </div>

    <div id="result" class="alert alert-secondary mt-4" role="status" aria-live="polite">
      Select two facilities to compare their airports.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const DATA = {
      groups: [
        { name: "DELHI APTMO", airport: "Indira Gandhi International Airport", iata: "DEL", entries: ["1 CBPO", "Agra NSH", "Ajmer NSH", "Ambala NSH", "Amritsar NSH", "Bareilly NSH", "Bhopal NSH", "Chandigarh NSH", "Dehradun NSH", "Ghaziabad NSH", "Gorakhpur NSH", "Gurgaon NSH", "Gwalior NSH", "Jaipur NSH", "Jalandhar NSH", "Jammu NSH", "Jodhpur NSH", "Kanpur NSH", "Karnal NSH", "Lucknow NSH", "Ludhiana NSH", "Moradabad NSH", "New Delhi NSH", "Srinagar NSH", "Pathankot NSH", "Prayagraj NSH", "Rohtak NSH", "Shimla NSH", "Varanasi NSH", "Rudrapur NSH"] },
        { name: "APTMO MUMBAI", airport: "Chhatrapati Shivaji Maharaj International Airport", iata: "BOM", entries: ["Aurangabad NSH", "Barauni NSH", "Berhampur NSH", "Bhubaneswar NSH", "Dhanbad NSH", "Gaya NSH", "Indore NSH", "Jabalpur NSH", "Jamshedpur NSH", "Mumbai NSH", "Muzaffarpur NSH", "Nagpur NSH", "Panaji NSH", "Patna NSH", "Pune NSH", "Raipur NSH", "Ranchi NSH", "Rourkela NSH", "Sambalpur NSH", "Thane NSH", "Nashik Road NSH"] },
        { name: "GUWAHATI TMO", airport: "Lokpriya Gopinath Bordoloi International Airport", iata: "GAU", entries: ["Agartala NSH", "Aizawl NSH", "Dibrugarh NSH", "Dimapur NSH", "Guwahati NSH", "Imphal NSH", "Itanagar NSH", "Shillong NSH"] },
        { name: "SHAMSHABAD TMO", airport: "Rajiv Gandhi International Airport", iata: "HYD", entries: ["Kurnool NSH", "Tirupati NSH", "Vijayawada NSH", "Visakhapatnam NSH", "Warangal NSH", "Hyderabad NSH"] },
        { name: "KOLKATA APTMO", airport: "Netaji Subhas Chandra Bose International Airport", iata: "CCU", entries: ["Burdwan NSH", "Kharagpur NSH", "Kolkata NSH", "Siliguri NSH", "2 CBPO"] },
        { name: "BENGALURU NSH", airport: "Kempegowda International Airport", iata: "BLR", entries: ["Arsikere NSH", "Belagavi NSH", "Hubballi Dharwad NSH", "Kalaburagi NSH", "Mysuru NSH", "Port Blair NSH", "Bengaluru NSH"] },
        { name: "AHMEDABAD TMO", airport: "Sardar Vallabhbhai Patel International Airport", iata: "AMD", entries: ["Ahmedabad NSH", "Rajkot NSH", "Surat NSH", "Vadodara NSH"] }
      ]
    };

    const facilities = DATA.groups.flatMap((g) =>
      g.entries.map((name) => ({ name, group: g.name, iata: g.iata, airport: g.airport }))
    );
    const byName = new Map(facilities.map((f) => [f.name, f]));

    const selA = document.getElementById("facilityA");
    const selB = document.getElementById("facilityB");
    const infoA = document.getElementById("infoA");
    const infoB = document.getElementById("infoB");
    const result = document.getElementById("result");

    function fill(select) {
      for (const f of facilities) {
        const opt = document.createElement("option");
        opt.value = f.name;
        opt.textContent = f.name;
        select.appendChild(opt);
      }
    }

    fill(selA);
    fill(selB);

    function syncOptions() {
      const a = selA.value;
      const b = selB.value;
      for (const opt of selB.options) {
        if (opt.value) opt.disabled = opt.value === a;
      }
      for (const opt of selA.options) {
        if (opt.value) opt.disabled = opt.value === b;
      }
    }

    function showInfo(el, facility) {
      el.textContent = facility ? `${facility.group} · ${facility.iata}` : "";
    }

    function haptic(pattern) {
      if (navigator.vibrate) navigator.vibrate(pattern);
    }

    function updateResult() {
      const a = byName.get(selA.value);
      const b = byName.get(selB.value);

      showInfo(infoA, a);
      showInfo(infoB, b);

      if (!a || !b) {
        result.className = "alert alert-secondary mt-4";
        result.textContent = "Select two facilities to compare their airports.";
        return;
      }

      if (a.iata === b.iata) {
        result.className = "alert alert-success mt-4";
        result.innerHTML =
          `<strong>Match</strong> — both are handled via ${a.group} (${a.iata}).`;
        haptic(35);
      } else {
        result.className = "alert alert-danger mt-4";
        result.innerHTML =
          `<strong>No match</strong> — ${a.name} goes via ${a.iata} (${a.group}), ` +
          `while ${b.name} goes via ${b.iata} (${b.group}).`;
        haptic([35, 60, 35]);
      }
    }

    function onChange() {
      syncOptions();
      updateResult();
    }

    selA.addEventListener("change", onChange);
    selB.addEventListener("change", onChange);
  </script>
</body>
</html>
